spring:
  application:
    name: inbox-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/inbox_tracker
    username: inbox
    password: ${DB_PASSWORD:inbox}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:not-configured}
      chat:
        options:
          model: claude-haiku-4-5-20251001
          temperature: 0.0

app:
  graph:
    client-id: ${GRAPH_CLIENT_ID:not-configured}
    authority: https://login.microsoftonline.com/consumers
    token-cache-file: .msal-cache.json
  ingest:
    enabled: false
    interval: PT15M
    lookback-days: 14